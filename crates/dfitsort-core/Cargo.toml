[package]
name = "dfitsort-core"
description = "FITS header reading library behind the dfitsort CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["fits", "astronomy", "header"]
categories = ["science", "parser-implementations"]
readme = "README.md"
# The integration tests read ../../tests/fixtures, which the crate tarball does not contain.
exclude = ["tests/"]

[package.metadata.release]
# The workspace is tagged once, from the dfitsort crate (see release.toml).
tag = false

[dependencies]
flate2 = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
