[package]
name = "dfitsort"
description = "Fast FITS header listing and keyword tables, after ESO dfits/fitsort"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["fits", "astronomy", "dfits", "fitsort", "header"]
categories = ["command-line-utilities", "science"]
# The integration tests read ../../tests/fixtures, which the crate tarball does not contain.
exclude = ["tests/"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
dfitsort-core = { path = "../dfitsort-core", version = "0.2.0" }
rayon = "1"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[package.metadata.release]
# Keep the README's `cargo install --tag` on the release being made.
pre-release-replacements = [
  { file = "../../README.md", search = '--tag v[0-9]+\.[0-9]+\.[0-9]+', replace = "--tag v{{version}}", exactly = 1 },
]
