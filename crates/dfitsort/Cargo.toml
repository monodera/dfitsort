[package]
name = "dfitsort"
description = "Fast FITS header listing and keyword tables, after ESO dfits/fitsort"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["fits", "astronomy", "dfits", "fitsort", "header"]
categories = ["command-line-utilities", "science"]
# The integration tests read ../../tests/fixtures, which the crate tarball does not contain.
exclude = ["tests/"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
dfitsort-core = { path = "../dfitsort-core", version = "0.1.0" }
libc = "0.2"
rayon = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
