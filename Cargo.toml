[workspace]
resolver = "3"
members = ["crates/dfitsort-core", "crates/dfitsort"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/monodera/dfitsort"
homepage = "https://github.com/monodera/dfitsort"

[profile.release]
lto = true
codegen-units = 1
