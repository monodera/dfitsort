name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, build: cargo zigbuild }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, build: cargo zigbuild }
          - { os: macos-latest, target: aarch64-apple-darwin, build: cargo build }
          - { os: macos-latest, target: x86_64-apple-darwin, build: cargo build }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
      - if: runner.os == 'Linux'
        run: cargo install --locked cargo-zigbuild
      - run: scripts/package.sh ${{ matrix.target }}
        env:
          BUILD: ${{ matrix.build }}
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
