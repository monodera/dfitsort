name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the Cargo.toml version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "dfitsort") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version (use cargo release)"
            exit 1
          fi
      - run: cargo test --workspace --locked

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, build: cargo zigbuild }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, build: cargo zigbuild }
          - { os: macos-latest, target: aarch64-apple-darwin, build: cargo build }
          - { os: macos-latest, target: x86_64-apple-darwin, build: cargo build }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
      - if: runner.os == 'Linux'
        run: cargo install --locked cargo-zigbuild
      - run: scripts/package.sh ${{ matrix.target }}
        env:
          BUILD: ${{ matrix.build }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # Releases are immutable: once published, no asset can be added. Upload all
  # archives in one step, after every build has finished.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
