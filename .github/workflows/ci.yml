name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: astral-sh/setup-uv@v6
      - run: cargo build -p dfitsort
      - run: uv run --no-project --with astropy --with numpy tests/oracle/check_astropy.py target/debug/dfitsort

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --workspace --all-targets

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install --locked cargo-fuzz
      - run: mkdir -p fuzz/corpus/headers && cp tests/fixtures/*.fits* fuzz/corpus/headers/
      - run: cargo fuzz run headers fuzz/corpus/headers -- -max_total_time=120
